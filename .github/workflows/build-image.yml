name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One build at a time per ref — a stale build must not race a newer one.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # BuildKit needs room for both unpacked CUDA wheels and exported layers.
      # These preinstalled SDKs are unused by this Python/Docker build.
      - name: Free disk space for the GPU image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # The CUDA/TensorRT stack comes from pip wheels (see requirements.txt),
      # so this builds on a plain x86_64 runner — no GPU, no nvidia-toolkit.
      #
      # Registry cache, not type=gha: the pip layer alone is multi-GB, which
      # the 10 GB Actions cache quota evicts within a couple of builds, and the
      # GHA cache is per-branch anyway. A :buildcache tag on GHCR has no such
      # quota and is shared across branches/refs. mode=max keeps intermediate
      # layers (the base + apt layer) cacheable too; the cache tag is
      # overwritten each build, so it never accumulates garbage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Report remaining disk space
        if: always()
        run: df -h /
