# parakeet-server Deployment — pulls the image GitHub Actions builds and pushes
# to GHCR (public image, no pull secret needed). The pod does NOT build
# anything; it pulls the prebuilt image and runs the API server. The GPU comes
# from the node's NVIDIA driver via nvidia-container-toolkit
# (nvidia.com/gpu resource).
#
# Probe layout (matches app.py endpoints):
#   startupProbe  /health  — answers 200 as soon as uvicorn is up (status
#                            "degraded" until the model loads), so it only
#                            proves the HTTP server bound its port.
#   readinessProbe /ready  — 503 until the ASR model is loaded, so the Service
#                            never routes to a pod that cannot transcribe yet.
#   no livenessProbe       — the first start runs a one-time .nemo -> ONNX ->
#                            TensorRT engine build that can take tens of
#                            minutes; a liveness probe would kill the pod
#                            mid-build. The startup budget below covers it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parakeet-server
  labels:
    app: parakeet-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parakeet-server
  template:
    metadata:
      labels:
        app: parakeet-server
    spec:
      containers:
        - name: parakeet-server
          image: ghcr.io/flozi00/parakeet-server:main
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            # Model + provider knobs (see app.py). Defaults match the app.
            - name: ASR_MODEL_NAME
              value: "primeline/parakeet-primeline"
            - name: ASR_PROVIDER
              value: "tensorrt"
            - name: USE_VAD
              value: "true"
            # Optional Nemotron speaker diarization (loaded on first request).
            # - name: DIARIZATION_ENABLED
            #   value: "true"
            # - name: DIARIZATION_DEVICE
            #   value: "cuda"
            # Online training (one replica/process per training repository):
            # - name: TRAINING_REPO_ID
            #   value: "your-account/parakeet-online"
            # HF_TOKEN below needs write access; training also needs additional
            # GPU/host memory for gradients and optimizer state. /ready returns
            # 503 during training and inference reload.
            # Gated/private HF repos: set from a Secret, not inline:
            #   kubectl create secret generic hf-token --from-literal=token=***
            # - name: HF_TOKEN
            #   valueFrom:
            #     secretKeyRef: { name: hf-token, key: token }
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "16Gi"
            requests:
              nvidia.com/gpu: 1
              memory: "8Gi"
          # The one-time .nemo -> ONNX export + TensorRT engine live here. Keep
          # them on a PVC (or a node-path hostPath) so a pod restart reuses the
          # engine instead of rebuilding it from scratch.
          volumeMounts:
            - name: onnx-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            # 10 s x 360 = 1 h for uvicorn to bind + first engine build.
            failureThreshold: 360
      volumes:
        - name: onnx-cache
          emptyDir: {}
          # Production: swap for a PVC so the ONNX/TensorRT cache survives
          # rescheduling:
          # persistentVolumeClaim: { claimName: parakeet-onnx-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: parakeet-server
spec:
  selector:
    app: parakeet-server
  ports:
    - port: 8000
      targetPort: http
